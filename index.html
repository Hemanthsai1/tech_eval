<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ML Project Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: auto;
        padding: 20px;
        line-height: 1.6;
      }

      h1,
      h2 {
        color: #333;
      }

      video {
        width: 100%;
        max-height: 480px;
        margin-bottom: 20px;
      }

      iframe {
        width: 100%;
        height: 600px;
        border: none;
      }

      .download-link {
        margin-top: 10px;
        display: inline-block;
        background: #007acc;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 5px;
      }

      .download-link:hover {
        background: #005f99;
      }

      .image-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 20px;
      }

      .image-gallery img {
        width: 100%;
        max-width: 400px;
        height: auto;
        border: 1px solid #ccc;
        padding: 5px;
        background: #f9f9f9;
        transition: transform 0.3s ease;
      }

      .image-gallery img:hover {
        transform: scale(1.1);
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <h1>ML Project Demo</h1>

    <h2>Project Video</h2>
    <video controls>
      <source src="octoparse.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <h2>Project Presentation</h2>
    <a
      href="Octoparse_&_Oxylabs_Presentation.pptx"
      class="download-link"
      download
      >Download PPTX</a>

    <h2>Images</h2>
    <div class="image-gallery">
      <img src="nice.png" alt="Result 1" />
      <img src="what_.png" alt="Result 2" />
    </div>
  </body>
</html>
